version: '3.8'

services:
  # Host Environment SDK Isolation Sandbox
  app:
    image: golang:1.26
    container_name: transactional-system-go-chi-app
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - APP_ENV=development
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:-postgresql://dev_user:dev_password@postgresql:5432/transactional-system-go-chi_db}
    ports:
      - "8080:8080"
    depends_on:
      - postgresql

  # Database Service (postgresql)
  postgresql:
    image: postgres:16-alpine
    container_name: transactional-system-go-chi-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transactional-system-go-chi_db}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: transactional-system-go-chi-redis
    ports:
      - "6379:6379"

volumes:
  db_data:
